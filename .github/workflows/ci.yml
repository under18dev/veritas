name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [26]
        # Run in parallel: static checks, unit tests and the performance budget; and the acceptance tests in two
        # shards (Vitest --shard splits them by file).
        part: [static, acceptance 1/2, acceptance 2/2]
        include:
          # Node 24 cannot block network access from project code; like the GitHub Action (node24 runtime), it runs
          # sandboxed code with a newer Node.js named by VERITAS_SANDBOX_NODE.
          - os: ubuntu-latest
            node: 24
            sandbox-node: 26
            part: static
          - os: ubuntu-latest
            node: 24
            sandbox-node: 26
            part: acceptance 1/2
          - os: ubuntu-latest
            node: 24
            sandbox-node: 26
            part: acceptance 2/2
    name: check (${{ matrix.os }}, node ${{ matrix.node }}, ${{ matrix.part }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - name: Node.js for sandboxed project code
        if: matrix.sandbox-node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.sandbox-node }}
      - if: matrix.sandbox-node
        shell: bash
        run: echo "VERITAS_SANDBOX_NODE=$(command -v node)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Install Lean (elan)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain stable --no-modify-path
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install Lean (elan, Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://raw.githubusercontent.com/leanprover/elan/master/elan-init.ps1 -OutFile elan-init.ps1
          ./elan-init.ps1 -NoPrompt 1 -DefaultToolchain stable
          echo "$env:USERPROFILE\.elan\bin" >> $env:GITHUB_PATH
      - name: Download the Lean toolchain
        run: lean --version && lake --version
      - run: pnpm install --frozen-lockfile
      - if: matrix.part == 'static'
        run: pnpm lint
      - if: matrix.part == 'static'
        run: pnpm licenses:check
      - if: matrix.part == 'static'
        run: pnpm typecheck
      - if: matrix.part == 'static'
        run: pnpm test
      - name: Acceptance tests (shard)
        if: startsWith(matrix.part, 'acceptance')
        shell: bash
        run: pnpm build && pnpm exec vitest run --project acceptance --shard="${PART#acceptance }"
        env:
          PART: ${{ matrix.part }}
      - name: Performance budget
        if: matrix.part == 'static'
        run: pnpm build && node benchmarks/run.mjs --check --keep-runs veritas-runs
      # The run artifacts (reports, claims, solver input and output, artifact index) are kept for reproduction.
      # Every artifact is redacted when written; fixtures contain no secrets.
      - name: Upload Veritas run artifacts
        if: always() && matrix.part == 'static'
        uses: actions/upload-artifact@v4
        with:
          name: veritas-runs-${{ matrix.os }}-node${{ matrix.node }}
          path: |
            veritas-runs
            benchmarks/results
          retention-days: 14
          if-no-files-found: warn
      - name: clean install from packed tarballs
        if: matrix.part == 'static'
        run: node scripts/clean-install-check.mjs
      - name: schemas are up to date
        if: matrix.os == 'ubuntu-latest' && matrix.part == 'static'
        run: pnpm schemas && git diff --exit-code schemas
      - name: documentation site builds (no dead links)
        if: matrix.os == 'ubuntu-latest' && matrix.node == 26 && matrix.part == 'static'
        run: pnpm docs:build

  # Veritas checks its own policy invariants (the properties declared in .veritas/config.json): each one must be
  # accepted, proven within the model by Z3 with the result replayed in JavaScript, and kernel-checked by Lean.
  # No Veritas result is cached between workflow runs (no .veritas/cache, no earlier runs), so a stale result cannot
  # pass.
  self-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - name: Install Lean (elan)
        shell: bash
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain stable --no-modify-path
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Download the Lean toolchain
        run: lean --version && lake --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # prove exits 0 only when the run passed the policy; any other exit code fails the job here.
      - name: Prove the declared invariants (Z3 and Lean)
        run: node packages/cli/dist/bin.js --json prove --engine both
      - name: Every invariant is proven by Z3 (replayed) and kernel-checked by Lean
        run: node scripts/check-self-verification.mjs
      # Negative control: a declaration that does not hold must come back with a counterexample reproduced in
      # JavaScript, so a solver or translator that proves anything cannot pass the check above unnoticed.
      - name: Negative control (declared-properties fixture)
        shell: bash
        run: |
          fixture="$RUNNER_TEMP/declared-properties"
          cp -R fixtures/declared-properties "$fixture"
          status=0
          node packages/cli/dist/bin.js --root "$fixture" --json prove --engine both || status=$?
          # The control is accepted and refuted: a confirmed policy failure, exit 1. Any other code is a broken run.
          if [ "$status" -ne 1 ]; then
            echo "expected exit 1 (confirmed violation), got $status"
            exit 1
          fi
          node scripts/check-self-verification.mjs --root "$fixture" \
            --expect-counterexample stage.unguarded-succeeded-needs-tests
      # The runs (claims, solver input and output, Lean files) are kept for reproduction.
      - name: Upload the self-verification runs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: self-verification-runs
          path: |
            .veritas/runs
            ${{ runner.temp }}/declared-properties/.veritas/runs
          retention-days: 14
          if-no-files-found: warn
