name: benchmark

# Measures the base and the head of a pull request one after the other on the same runner, and keeps the report as an
# artifact. This workflow runs the pull request's code, so it has no write permission and no secrets; the separate
# benchmark-comment workflow posts the report.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: benchmark-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the head
        uses: actions/checkout@v4
        with:
          path: head
          submodules: false
          persist-credentials: false
      - name: Check out the base
        uses: actions/checkout@v4
        with:
          path: base
          ref: ${{ github.event.pull_request.base.sha }}
          submodules: false
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: head/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      # GNU time records the peak memory of each run.
      - name: Install GNU time
        run: command -v /usr/bin/time > /dev/null || (sudo apt-get update -q && sudo apt-get install -y -q time)
      - name: Build the head
        working-directory: head
        run: pnpm install --frozen-lockfile && pnpm build
      - name: Build the base
        working-directory: base
        run: pnpm install --frozen-lockfile && pnpm build
      # The head's scripts measure both builds on the same fixtures and projects, base first.
      - name: Fixtures (base)
        run: node head/benchmarks/run.mjs --cli base/packages/cli/dist/bin.js --out out/fixtures-base.json
      - name: Fixtures (head)
        run: node head/benchmarks/run.mjs --cli head/packages/cli/dist/bin.js --out out/fixtures-head.json
      - name: Open-source projects (base)
        run: node head/benchmarks/real.mjs --work work --cli base/packages/cli/dist/bin.js --out out/real-base.json
      - name: Open-source projects (head)
        run: node head/benchmarks/real.mjs --work work --cli head/packages/cli/dist/bin.js --out out/real-head.json
      - name: Report
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          node head/benchmarks/compare.mjs \
            --base out/fixtures-base.json --head out/fixtures-head.json \
            --real-base out/real-base.json --real-head out/real-head.json \
            --base-ref "$BASE_REF@${BASE_SHA:0:7}" --head-ref "${HEAD_SHA:0:7}" > out/comment.md
          printf '{"number":%s,"headSha":"%s"}\n' "$PR_NUMBER" "$HEAD_SHA" > out/pr.json
          cat out/comment.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark
          path: out/
          retention-days: 14
